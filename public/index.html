<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Popcorn Party – follow an actor from one film to your favorite streaming service</title>
  <meta name="description" content="Search a movie, pick a character, and find something to watch. ">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="preload" href="assets/Arcane_Nine.otf" as="font" type="font/otf" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="masthead">
    <a class="brand" href="/" aria-label="Popcorn Party home">Popcorn Party</a>
    <nav id="crumbs" aria-label="Breadcrumb" hidden></nav>
  </header>
  <main id="app" tabindex="-1"></main>
  <p id="status" class="sr-only" role="status" aria-live="polite"></p>

    <img src="assets/tmdb-logo.svg" alt="TMDB" height="14" onerror="this.remove()">

  </footer>
  <script src="app.js"></script>
</body>
</html>
